# Local / single-VPS family stack (ADR 0005). Personal tracker does not need this.
# Secrets below are development defaults — replace before any shared host.

name: lumi-family

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_only
      POSTGRES_DB: lumi_app
    ports:
      - '5433:5432'
    volumes:
      - lumi_pg_data:/var/lib/postgresql/data
      - ../migrations/001_family_identity.sql:/docker-entrypoint-initdb.d/001_family_identity.sql:ro
      - ../migrations/002_worker_jobs.sql:/docker-entrypoint-initdb.d/002_worker_jobs.sql:ro
      - ../migrations/003_family_invitations.sql:/docker-entrypoint-initdb.d/003_family_invitations.sql:ro
      - ../migrations/004_family_sync.sql:/docker-entrypoint-initdb.d/004_family_sync.sql:ro
      - ../migrations/005_backup_erasure.sql:/docker-entrypoint-initdb.d/005_backup_erasure.sql:ro
      - ../migrations/006_family_attachments.sql:/docker-entrypoint-initdb.d/006_family_attachments.sql:ro
      - ../migrations/007_family_attachment_quota.sql:/docker-entrypoint-initdb.d/007_family_attachment_quota.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lumi_app']
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - lumi_internal

  # Self-hosted OIDC candidate (Keycloak). Start with: --profile oidc
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command:
      [
        'start-dev',
        '--http-port=8080',
        '--import-realm',
      ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_only
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak/realm-lumi.json:/opt/keycloak/data/import/realm-lumi.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['oidc']
    networks:
      - lumi_internal

  api:
    image: node:22.15.0-bookworm-slim
    working_dir: /workspace/apps/lumi-api
    command: ['node', '--experimental-strip-types', 'src/main.ts']
    environment:
      LUMI_API_HOST: 0.0.0.0
      LUMI_API_PORT: '8787'
      LUMI_DATABASE_URL: postgres://lumi_app:lumi_app_dev_only@postgres:5432/lumi_app
      LUMI_OIDC_ISSUER: http://127.0.0.1:8080/realms/lumi
      LUMI_OIDC_AUDIENCE: lumi-api
      LUMI_TEST_HS256_SECRET: local_dev_hs256_only
      LUMI_CORS_ORIGINS: http://127.0.0.1:8081
      # Optional: point at Compose S3Mock when profile attachments is also up.
      # Leave unset for memory object store (personal-safe default).
      # LUMI_ATTACHMENT_STORE: r2
      # LUMI_R2_ENDPOINT: http://s3mock:9090
      # LUMI_R2_REGION: us-east-1
      # LUMI_R2_BUCKET: lumi-family-photos
      # LUMI_R2_ACCESS_KEY_ID: test
      # LUMI_R2_SECRET_ACCESS_KEY: test
    ports:
      - '8787:8787'
    volumes:
      - ../../..:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['api']
    networks:
      - lumi_internal

  # Local S3-compatible object store for family photo adapter drills.
  # Adobe S3Mock stands in for MinIO: Docker Hub removed minio/minio and Quay
  # pulls currently return 401 in this environment. Same SigV4 path-style client.
  # Start with: docker compose --profile attachments up -d s3mock
  # Not required for personal tracker boots (attachment store stays memory).
  s3mock:
    image: adobe/s3mock:3.12.0
    environment:
      initialBuckets: lumi-family-photos
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: us-east-1
    ports:
      - '9090:9090'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - http://127.0.0.1:9090/ >/dev/null || exit 1',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles: ['attachments']
    networks:
      - lumi_internal

volumes:
  lumi_pg_data:

networks:
  lumi_internal:
    driver: bridge
