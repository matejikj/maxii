name: Explicit npm publish (opt-in only)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        description: 'Audited git tag, e.g. v1.0.0'
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm-publish-approval
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Enforce ownership, license and reproducible lockfile
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          test -s package-lock.json || exit 1
          node -e "let p=require('./package.json');if(p.license==='UNLICENSED')throw Error('Set a reviewed license before public npm publication');if('v'+p.version!==process.env.TAG)throw Error('Incorrect release tag')"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --no-audit
      - run: python -m pip install -r tools/requirements-visual.txt
      - run: npm run build && npm run typecheck:all && npm run test:all && npm run release:verify-package && npm run release:smoke-core && npm run expo:bundle:android && npm run expo:bundle:ios
      - name: Require physical-device release evidence
        run: |
          npm run release:verify-device
          node -e "const e=require('./release-evidence/manifest.json');const head=require('child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();if(e.gitCommit!==head)throw Error('Device evidence commit mismatch')"
      - name: Enable OIDC npm CLI (npm trusted publisher must be configured first)
        run: npm install -g npm@^11.5.1
      - name: Publish explicitly, using npm trusted publishing and provenance
        run: npm publish --access public --ignore-scripts
