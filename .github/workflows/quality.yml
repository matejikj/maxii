name: LUMI CI PR (fast; not a device certification)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c4804d46898778ad8554cb37 # v4.1.0
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Install image-regression dependencies
        run: python -m pip install -r packages/lumi-forest/tools/requirements-visual.txt
      - name: Lockfile, import boundaries and secret scan
        run: |
          npm run check:lockfile
          npm run check:boundaries
          npm run check:secrets
      - name: Build distributable package before consumer typecheck
        run: npm run build
      - name: Public API, TypeScript, lint, contract and source tests
        run: |
          npm run typecheck:all
          npm run lint:baby
          npm run test:all
          npm run test:baby:pr
      - name: Validate contents of publication tarball
        run: npm run release:verify-package --workspace @lumi/forest-design && npm run release:smoke-core --workspace @lumi/forest-design && npm pack --workspace @lumi/forest-design --dry-run --ignore-scripts
      - name: SBOM snapshot (artifact is non-secret dependency inventory)
        run: npm run sbom
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lumi-regression-diagnostics
          path: |
            packages/lumi-forest/tests/**/actual/
            packages/lumi-forest/reports/
          if-no-files-found: ignore
