name: LUMI CI (not a device certification)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Install image-regression dependencies
        run: python -m pip install -r packages/lumi-forest/tools/requirements-visual.txt
      - name: Build distributable package before consumer typecheck
        run: npm run build
      - name: Public API, TypeScript, contract and source tests
        run: |
          npm run typecheck:all
          npm run test:all
      - name: Validate contents of publication tarball
        run: npm run release:verify-package --workspace @lumi/forest-design && npm run release:smoke-core --workspace @lumi/forest-design && npm pack --workspace @lumi/forest-design --dry-run --ignore-scripts
      - name: Expo dependency alignment and mobile/web Metro exports
        run: |
          npm run expo:doctor
          npm run expo:bundle:android
          npm run expo:bundle:ios
          npm run expo:bundle:web
          npm run expo:storybook:bundle:android
          npm run expo:storybook:bundle:web
          npm run baby:doctor
          npm run baby:bundle:android
          npm run baby:bundle:ios
          npm run baby:bundle:web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-regression-diagnostics
          path: |
            packages/lumi-forest/tests/**/actual/
            packages/lumi-forest/reports/
          if-no-files-found: ignore
