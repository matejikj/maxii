name: Explicit npm publish (opt-in only)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        description: 'Audited git tag, e.g. v1.0.0'
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm-publish-approval
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c4804d46898778ad8554cb37 # v4.1.0
        with:
          node-version: '22.16.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Enforce ownership, license and reproducible lockfile
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          test -s package-lock.json || exit 1
          node -e "let p=require('./packages/lumi-forest/package.json');if(p.license==='UNLICENSED')throw Error('Set a reviewed license before public npm publication');if('v'+p.version!==process.env.TAG)throw Error('Incorrect release tag')"
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'
      - run: npm ci --no-audit
      - run: python -m pip install -r packages/lumi-forest/tools/requirements-visual.txt
      - run: npm run build && npm run typecheck --workspace @lumi/forest-design && npm run typecheck --workspace @lumi/showcase && npm run test:all --workspace @lumi/forest-design && npm run test:apps && npm run release:verify-package --workspace @lumi/forest-design && npm run release:smoke-core --workspace @lumi/forest-design && npm run expo:bundle:android && npm run expo:bundle:ios
      - name: Require physical-device release evidence
        working-directory: packages/lumi-forest
        run: |
          npm run release:verify-device
          node -e "const e=require('./release-evidence/manifest.json');const head=require('child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();if(e.gitCommit!==head)throw Error('Device evidence commit mismatch')"
      - name: Enable OIDC npm CLI (npm trusted publisher must be configured first)
        run: npm install -g npm@^11.5.1
      - name: Publish explicitly, using npm trusted publishing and provenance
        run: npm publish --workspace @lumi/forest-design --access public --ignore-scripts
