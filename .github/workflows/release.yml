name: Create audited LUMI 1.x release candidate
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing git tag (e.g. v1.0.0)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    environment: lumi-release-approval
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c4804d46898778ad8554cb37 # v4.1.0
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'
      - name: Fail closed unless reproducible lockfile is committed
        run: |
          test -s package-lock.json || { echo 'package-lock.json missing: release denied'; exit 1; }
      - run: npm ci --no-audit
      - run: python -m pip install -r packages/lumi-forest/tools/requirements-visual.txt
      - name: Gate all quality checks and export builds
        run: |
          npm run build
          npm run typecheck --workspace @lumi/forest-design
          npm run typecheck --workspace @lumi/showcase
          npm run test:all --workspace @lumi/forest-design
          npm run test:apps
          npm run expo:bundle:android
          npm run expo:bundle:ios
      - name: Require actual Android and iOS evidence for this exact commit
        working-directory: packages/lumi-forest
        run: |
          test -s release-evidence/manifest.json || { echo 'Physical device release evidence missing'; exit 1; }
          npm run release:verify-device
          node -e "const e=require('./release-evidence/manifest.json');const head=require('child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();if(e.gitCommit!==head)throw Error('Device evidence commit mismatch')"
      - name: Check semver and tag consistency
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          node -e "const p=require('./packages/lumi-forest/package.json');if(process.env.TAG!=='v'+p.version)throw Error('Tag/package version mismatch')"
      - name: Pack audited npm tarball (DO NOT publish to npm)
        run: npm run release:verify-package --workspace @lumi/forest-design && npm run release:smoke-core --workspace @lumi/forest-design && npm pack --workspace @lumi/forest-design --ignore-scripts --pack-destination .
      - name: Create GitHub release candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$TAG" ./*.tgz --title "LUMI Forest $TAG" --notes "Audited package; npm publication intentionally separate." --draft
